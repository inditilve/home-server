services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM= #optional
    volumes:
      - plex:/config
      - /data:/data
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 32400:32400
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    networks:
      - tailscale-net
    labels:   
      - deunhealth.restart.on.unhealthy=true
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - abs:/config
      - abs_metadata:/metadata
      - /data:/data
    ports:
      - 13378:80
    healthcheck:
      test: curl --fail http://localhost:13378/ || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s
    restart: unless-stopped

volumes:
  plex:
  abs:
  abs_metadata:
networks:
  tailscale-net:
    external: true