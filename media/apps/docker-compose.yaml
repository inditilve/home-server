services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM= #optional
    volumes:
      - plex:/config
      - /data:/data
    devices:
      - "/dev/dri:/dev/dri"
    ports:
      - 32400:32400
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - abs:/config
      - abs_metadata:/metadata
      - /data:/data
    ports:
      - 13378:80
    restart: unless-stopped
volumes:
  plex:
  abs:
  abs_metadata: