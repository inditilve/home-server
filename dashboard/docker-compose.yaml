services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3001,${HOSTNAME}:3001,${TAILSCALE_URL}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3001:3000

volumes:
  homepage:

networks:
  default:
    external: true
    name: tailscale-net