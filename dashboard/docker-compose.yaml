services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - tailscale-net
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3001,${TAILSCALE_URL}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:3001:3000
    healthcheck:
      test: curl --fail http://localhost:3001/ || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s
    restart: unless-stopped
volumes:
  homepage:
networks:
  tailscale-net:
    external: true